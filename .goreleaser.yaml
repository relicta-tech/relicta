# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser configuration for Relicta
# Handles cross-platform builds while Relicta manages release governance

version: 2

project_name: relicta

before:
  hooks:
    - make frontend
    - go mod tidy -diff
    - go mod verify

builds:
  - id: relicta
    main: ./cmd/relicta
    binary: relicta
    env:
      - CGO_ENABLED=0
    tags:
      - embed_frontend
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.ver={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    ids:
      - relicta
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  # Relicta supplies the approved release notes to GoReleaser in CI.
  # GoReleaser builds and uploads the signed release artifacts.
  draft: false
  use_existing_draft: true
  prerelease: auto
  mode: keep-existing

# Optional Apple Developer ID signing and notarization for the macOS CLI.
# Configure the five MACOS_* repository secrets to enable; without them,
# release artifacts remain checksum/Sigstore verified but are not notarized.
notarize:
  macos:
    - enabled: '{{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_SIGN_PASSWORD") (isEnvSet "MACOS_NOTARY_KEY") (isEnvSet "MACOS_NOTARY_KEY_ID") (isEnvSet "MACOS_NOTARY_ISSUER_ID") }}'
      ids:
        - relicta
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

# SBOM generation
sboms:
  - artifacts: archive

# Sign checksums with the cosign v3 bundle format (single .sigstore.json
# bundle replaces the .pem/.sig pair; v3 sign-blob errors without --bundle).
# Verify with: cosign verify-blob --bundle checksums.txt.sigstore.json \
#   --certificate-identity-regexp 'github.com/relicta-tech/relicta' \
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#   checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true
