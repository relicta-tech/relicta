version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "felixgeelhaar"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"
    groups:
      # Majors are excluded so they arrive as individual PRs. A grouped major is
      # a trap: tailwindcss 3->4 blocked 21 unrelated web updates in #215, and a
      # go-anthropic major blocked 15 Go updates in #188. Breaking changes need
      # individual attention; minors and patches do not.
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "github.com/sashabaranov/go-openai"
      openai:
        patterns:
          - "github.com/sashabaranov/go-openai"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "felixgeelhaar"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "felixgeelhaar"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"

  # npm — web
  #
  # Without an explicit entry these directories received only Dependabot
  # *security* updates, which GitHub raises automatically for known advisories.
  # Routine version updates never happened, so they drifted until a CVE forced
  # a multi-version jump under time pressure (issue #198).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "felixgeelhaar"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
    groups:
      # Grouped deliberately: two npm directories at a limit of 5 each could
      # otherwise add ten PRs a week on top of the Go ones.
      web-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm — app
  #
  # Without an explicit entry these directories received only Dependabot
  # *security* updates, which GitHub raises automatically for known advisories.
  # Routine version updates never happened, so they drifted until a CVE forced
  # a multi-version jump under time pressure (issue #198).
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "felixgeelhaar"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
    groups:
      # Grouped deliberately: two npm directories at a limit of 5 each could
      # otherwise add ten PRs a week on top of the Go ones.
      app-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
