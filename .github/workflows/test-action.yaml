name: Test Relicta Action

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Relicta version to test'
        required: false
        default: 'v2.0.0'

# Default permissions - least privilege
permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Test Relicta Action
        uses: relicta-tech/relicta-action@0268e9a3001e9483874e5501d59fa929a42130f3 # v2
        with:
          version: ${{ github.event.inputs.version }}
          command: plan
          dry-run: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify relicta is installed
        run: |
          which relicta || echo "relicta not in PATH"
          relicta version || echo "relicta command failed"
