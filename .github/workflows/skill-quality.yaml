name: Skill Quality

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'skills/**'
      - 'examples/policies/**'
      - 'docs/skill-publishing-checklist.md'
      - '.github/pull_request_template.md'
      - '.github/workflows/skill-quality.yaml'
      - 'Makefile'
  push:
    branches: [main, develop]
    paths:
      - 'skills/**'
      - 'examples/policies/**'
      - 'docs/skill-publishing-checklist.md'
      - '.github/pull_request_template.md'
      - '.github/workflows/skill-quality.yaml'
      - 'Makefile'
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  GOTOOLCHAIN: local

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Skill Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Validate skill package and policy gates
        run: make skill-preflight
