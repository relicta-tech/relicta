name: Web Accessibility

# Gates Vue dashboard a11y regressions on every PR touching web/.
#
# Why: Compliance / Security Officer persona (regulated-industry buyer)
# often uses screen readers — an a11y regression blocks procurement
# motions explicitly. Catching at PR time costs minutes; catching at
# customer demo costs the deal.

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-a11y.yaml'
  push:
    branches: [main]
    paths:
      - 'web/**'

permissions:
  contents: read

concurrency:
  group: web-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe-core:
    name: Playwright + axe-core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm deps
        run: npm ci

      # The dashboard had eslint, its plugins and an `npm run lint` script, no config file,
      # a script passing flags eslint 9 removed, and no CI step — three layers of the same
      # omission, so linting had never run and nothing would have reported that. Placed
      # before the browser install because it is the faster signal.
      - name: Lint
        run: npm run lint:check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run a11y suite
        run: npm run test:a11y

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-a11y-report
          path: web/playwright-report
          if-no-files-found: ignore
