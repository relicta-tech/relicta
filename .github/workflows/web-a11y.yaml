name: Web Accessibility

# Gates Vue dashboard a11y regressions on every PR touching web/.
#
# Why: Compliance / Security Officer persona (regulated-industry buyer)
# often uses screen readers — an a11y regression blocks procurement
# motions explicitly. Catching at PR time costs minutes; catching at
# customer demo costs the deal.

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-a11y.yaml'
  push:
    branches: [main]
    paths:
      - 'web/**'

permissions:
  contents: read

concurrency:
  group: web-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Build and scan dashboard image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build dashboard frontend toolchain stage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: web
          file: web/docker/Dockerfile
          target: builder
          tags: relicta-dashboard-frontend:ci
          load: true
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Build dashboard image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: web
          file: web/docker/Dockerfile
          tags: relicta-dashboard:ci
          load: true
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.2
          cache: true

      - name: Scan dashboard image
        run: >-
          trivy image --scanners vuln --pkg-types os,library
          --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed=false
          relicta-dashboard:ci

      - name: Scan dashboard frontend toolchain
        run: >-
          trivy image --scanners vuln --pkg-types os,library
          --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed=false
          relicta-dashboard-frontend:ci

  axe-core:
    name: Playwright + axe-core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm deps
        run: npm ci

      # The dashboard had eslint, its plugins and an `npm run lint` script, no config file,
      # a script passing flags eslint 9 removed, and no CI step — three layers of the same
      # omission, so linting had never run and nothing would have reported that. Placed
      # before the browser install because it is the faster signal.
      - name: Lint
        run: npm run lint:check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run a11y suite
        run: npm run test:a11y

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-a11y-report
          path: web/playwright-report
          if-no-files-found: ignore
