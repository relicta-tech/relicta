name: Container Security

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'plugins/**'
      - 'web/**'
      - '.github/workflows/container-security.yaml'
      - '.github/workflows/release.yaml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'plugins/**'
      - 'web/**'
      - '.github/workflows/container-security.yaml'
      - '.github/workflows/release.yaml'

permissions:
  contents: read

concurrency:
  group: container-security-${{ github.ref }}
  # nox:ignore IAC-309 -- superseded scans for the same ref are safe to cancel; this workflow does not deploy or mutate infrastructure.
  cancel-in-progress: true

jobs:
  cli-image:
    name: Build and scan Relicta image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Relicta frontend toolchain stage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: frontend
          tags: relicta-frontend:ci
          load: true
          cache-from: type=gha,scope=relicta-container
          cache-to: type=gha,mode=max,scope=relicta-container

      - name: Build Relicta image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          tags: relicta:ci
          load: true
          cache-from: type=gha,scope=relicta-container
          cache-to: type=gha,mode=max,scope=relicta-container

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.2
          cache: true

      - name: Scan Relicta image
        run: >-
          trivy image --scanners vuln --pkg-types os,library
          --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed=false
          relicta:ci

      - name: Scan Relicta frontend toolchain
        run: >-
          trivy image --scanners vuln --pkg-types os,library
          --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed=false
          relicta-frontend:ci
