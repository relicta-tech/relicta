name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

env:
  GO_VERSION: '1.25'
  GOTOOLCHAIN: local

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions - least privilege
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          args: --timeout=5m

      - name: Run tests with coverage enforcement
        run: |
          go run go.klarlabs.de/coverctl@v1.17.0 check \
            --config .coverctl.yaml \
            --race \
            -v

  policy-gate:
    name: Policy Matrix Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Validate example policy
        run: |
          go run ./cmd/relicta policy validate --file examples/policies/starter.policy

      - name: Run policy matrix contract gate
        run: |
          go run ./cmd/relicta policy test \
            --file examples/policies/starter.policy \
            --matrix examples/policies/policy-matrix.yaml \
            --assert-expected \
            --json

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    # Only run benchmarks on main branch pushes (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -run=^$ ./internal/... ./pkg/... | tee bench-results.txt

      - name: Download previous benchmark data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark
          restore-keys: |
            ${{ runner.os }}-benchmark

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: 'go'
          output-file-path: bench-results.txt
          external-data-json-path: ./cache/benchmark-data.json
          alert-threshold: '200%'
          fail-on-alert: false
          comment-on-alert: false
          save-data-file: true
          auto-push: false

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
          # On PRs, only build linux/amd64 to save resources
          - os: ${{ github.event_name == 'pull_request' && 'darwin' || 'NONE' }}
            arch: amd64
          - os: ${{ github.event_name == 'pull_request' && 'darwin' || 'NONE' }}
            arch: arm64
          - os: ${{ github.event_name == 'pull_request' && 'windows' || 'NONE' }}
            arch: amd64
          - os: ${{ github.event_name == 'pull_request' && 'linux' || 'NONE' }}
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w" -o relicta-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }} ./cmd/relicta

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relicta-${{ matrix.os }}-${{ matrix.arch }}
          path: relicta-*

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install nox
        run: |
          curl -sSfL "https://github.com/nox-hq/nox/releases/download/v1.1.2/nox_1.1.2_linux_amd64.tar.gz" | tar xz -C /usr/local/bin nox
          nox version

      # nox is the single security scanner: secrets, IaC/workflow hygiene,
      # privacy/PII, AI-security rules, and dependency vulnerabilities via
      # OSV.dev (replaces govulncheck + gosec).
      - name: Run Nox Security Scan
        env:
          # v2 fingerprints are line-independent; with the default v1
          # (line+path+content) any PR that shifts lines invalidates
          # baseline entries and re-reports them as new findings.
          NOX_FINGERPRINT_VERSION: "2"
        run: |
          nox scan . -format json,sarif
          echo "## Nox Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "Scan passed against the reviewed baseline (.nox/baseline.json)." >> $GITHUB_STEP_SUMMARY

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: results.sarif
        if: always() && hashFiles('results.sarif') != ''
        continue-on-error: true

      - name: Upload Nox results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nox-scan-results
          path: findings.json
        if: always()

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Build binary for SBOM
        run: |
          go build -ldflags="-s -w" -o relicta ./cmd/relicta

      - name: Generate CycloneDX SBOM from source
        run: |
          syft dir:. -o cyclonedx-json=sbom-source.cdx.json

      - name: Generate CycloneDX SBOM from binary
        run: |
          syft file:relicta -o cyclonedx-json=sbom-binary.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: |
            sbom-source.cdx.json
            sbom-binary.cdx.json

      - name: Add SBOM summary
        run: |
          echo "## SBOM Generation" >> $GITHUB_STEP_SUMMARY
          echo "- Source SBOM: sbom-source.cdx.json (CycloneDX)" >> $GITHUB_STEP_SUMMARY
          echo "- Binary SBOM: sbom-binary.cdx.json (CycloneDX)" >> $GITHUB_STEP_SUMMARY
          COMPONENT_COUNT=$(jq '.components | length' sbom-source.cdx.json 2>/dev/null || echo "unknown")
          echo "- Components detected: ${COMPONENT_COUNT}" >> $GITHUB_STEP_SUMMARY

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    # Only run on pushes to main (not PRs, to save resources)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        run: |
          make test-integration

      - name: Add integration test summary
        if: always()
        run: |
          echo "## Integration Tests" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "All integration tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "Some integration tests failed - review logs" >> $GITHUB_STEP_SUMMARY
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
