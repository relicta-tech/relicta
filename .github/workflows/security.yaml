name: Security Analysis

# Nox is the single security scanner for this repository: secrets,
# IaC/workflow hygiene, privacy/PII, AI-security rules, and dependency
# vulnerabilities via OSV.dev. This workflow is the scheduled deep scan;
# ci.yaml runs the same scan on every push/PR.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NOX_VERSION: '1.70.0'
  NOX_SHA256_LINUX_AMD64: '5ab377a72bbdf0da4ee4eeb068e3b516357e3e363db2491534e14aea72c8135e'

jobs:
  nox-scan:
    name: Nox Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install nox
        run: |
          archive="nox_${NOX_VERSION}_linux_amd64.tar.gz"
          curl --fail --show-error --silent --location \
            "https://github.com/nox-hq/nox/releases/download/v${NOX_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          echo "${NOX_SHA256_LINUX_AMD64}  /tmp/${archive}" | sha256sum --check --status
          tar xz -C /usr/local/bin -f "/tmp/${archive}" nox
          nox version

      - name: Install Cosign for Nox plugin verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run nox scan
        env:
          # v2 fingerprints are line-independent so baseline entries
          # survive code movement between scans.
          NOX_FINGERPRINT_VERSION: "2"
        run: |
          nox scan . --severity-threshold high --fail-on-degraded -format json,sarif
          echo "## Nox Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "No new HIGH or CRITICAL findings beyond the reviewed baseline (.nox/baseline.json)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: results.sarif
        if: always() && hashFiles('results.sarif') != ''
        continue-on-error: true

      - name: Upload findings artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: nox-weekly-findings
          path: findings.json
        if: always()
