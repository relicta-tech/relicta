name: Security Analysis

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  GO_VERSION: '1.25'
  GOTOOLCHAIN: local

jobs:
  nox-scan:
    name: Nox Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install nox
        run: go install github.com/felixgeelhaar/nox/cmd/nox@latest

      - name: Run nox scan
        run: |
          nox scan --json -o nox-results.json .
          echo "## Nox Security Scan Results" >> $GITHUB_STEP_SUMMARY

      - name: Check for critical/high findings
        id: check
        run: |
          if [ -f nox-results.json ]; then
            CRITICAL=$(jq '[.findings[] | select(.severity == "critical")] | length' nox-results.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.findings[] | select(.severity == "high")] | length' nox-results.json 2>/dev/null || echo "0")
            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high=$HIGH" >> $GITHUB_OUTPUT
            echo "- Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
            echo "- High: $HIGH" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload nox results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: nox-security-results
          path: nox-results.json
        if: always()

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "## Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          if govulncheck ./... 2>&1; then
            echo "✅ No known vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Vulnerabilities detected - review required" >> $GITHUB_STEP_SUMMARY
          fi
