version: 1
policy:
  default:
    min: 80
  domains:
    - name: cmd
      match:
        - ./cmd/...
      min: 0
    - name: analysis
      match:
        - ./internal/analysis/...
      min: null
    - name: application
      match:
        - ./internal/application/...
      min: null
    - name: cgp
      match:
        - ./internal/cgp/...
      min: null
    - name: cli
      match:
        - ./internal/cli/...
      min: 54
    - name: config
      match:
        - ./internal/config/...
      min: null
    - name: container
      match:
        - ./internal/container/...
      min: 51
    - name: domain
      match:
        - ./internal/domain/...
      min: null
    - name: errors
      match:
        - ./internal/errors/...
      min: null
    - name: fileutil
      match:
        - ./internal/fileutil/...
      min: null
    - name: infrastructure
      match:
        - ./internal/infrastructure/...
      min: 76
    - name: mcp
      match:
        - ./internal/mcp/...
      min: 45
    - name: observability
      match:
        - ./internal/observability/...
      min: null
    - name: plugin
      match:
        - ./internal/plugin
        - ./internal/plugin/audit/...
        - ./internal/plugin/manager/...
        - ./internal/plugin/sandbox/...
      min: null
    - name: security
      match:
        - ./internal/security/...
      min: 75
    - name: ui
      match:
        - ./internal/ui/...
      min: null
    - name: pkg
      match:
        - ./pkg/...
      min: null
    # Everything below sat outside every domain until now, so none of it had a coverage
    # threshold: the whole REST API, the SOC 2 and DORA report generation, and the
    # compliance integrations could lose their tests without `coverctl check` noticing.
    # It reported "All 18 domains pass" while nine domains' worth of code was unmeasured.
    #
    # Their tests did still run — coverctl executes the suite and uses the domain list
    # for coverage attribution, which a canary test in internal/httpserver confirmed by
    # failing under the old config too. So this closes a gating hole, not a hole in test
    # execution.
    #
    # Thresholds lock in the coverage measured when they were added rather than aspiring
    # upward, so the gate starts honest and any regression from here is visible.
    - name: httpserver
      match:
        - ./internal/httpserver/...
      # Explicit rather than null: the tree is at 76.6% and null inherits the 80%
      # default, which would fail on arrival. Same reason infrastructure and security
      # carry explicit values.
      min: 74
    - name: compliance
      match:
        - ./internal/compliance/...
      min: null
    - name: analytics
      match:
        - ./internal/analytics/...
      min: null
    - name: service
      match:
        - ./internal/service/...
      min: null
    - name: logging
      match:
        - ./internal/logging/...
      min: null
    - name: integrations
      match:
        - ./internal/integrations/...
      min: null
    - name: version
      match:
        - ./internal/version/...
      min: null
    # Architecture holds no statements — its tests assert import-boundary rules. Listed
    # so they run at all; min: 0 for the same reason cmd and docs use it.
    - name: architecture
      match:
        - ./internal/architecture/...
      min: 0
    - name: benchmark
      match:
        - ./internal/benchmark/...
      min: null
    - name: docs
      match:
        - ./docs/...
      # min: 0, not null: null inherits the 80% default, and a package with no
      # statements can never reach it. cmd uses 0 for the same reason.
      min: 0
exclude:
  - internal/plugin/proto/*
