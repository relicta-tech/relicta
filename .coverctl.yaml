version: 1
policy:
  default:
    min: 80
  domains:
    - name: cmd
      match:
        - ./cmd/...
      min: 0
    - name: analysis
      match:
        - ./internal/analysis/...
      min: null
    - name: application
      match:
        - ./internal/application/...
      min: null
    - name: cgp
      match:
        - ./internal/cgp/...
      min: null
    - name: cli
      match:
        - ./internal/cli/...
      min: 54
    - name: config
      match:
        - ./internal/config/...
      min: null
    - name: container
      match:
        - ./internal/container/...
      min: 51
    - name: domain
      match:
        - ./internal/domain/...
      min: null
    - name: errors
      match:
        - ./internal/errors/...
      min: null
    - name: fileutil
      match:
        - ./internal/fileutil/...
      min: null
    - name: infrastructure
      match:
        - ./internal/infrastructure/...
      min: 76
    - name: mcp
      match:
        - ./internal/mcp/...
      min: 45
    - name: observability
      match:
        - ./internal/observability/...
      min: null
    - name: plugin
      match:
        - ./internal/plugin
        - ./internal/plugin/audit/...
        - ./internal/plugin/manager/...
        - ./internal/plugin/sandbox/...
      min: null
    - name: security
      match:
        - ./internal/security/...
      min: 75
    - name: ui
      match:
        - ./internal/ui/...
      min: null
    - name: pkg
      match:
        - ./pkg/...
      min: null
    # docs/adr holds no production code — its tests assert that the ADR index
    # stays honest (every linked record exists, no conflict markers). Listed here
    # because coverctl enumerates domains explicitly, so a package outside them is
    # never run: the checks would have looked present and executed nowhere, which
    # is the failure they exist to catch. min: null since there is nothing to
    # cover.
    - name: docs
      match:
        - ./docs/...
      # min: 0, not null: null inherits the 80% default, and a package with no
      # statements can never reach it. cmd uses 0 for the same reason.
      min: 0
exclude:
  - internal/plugin/proto/*
