# Relicta configuration. Generated by 'relicta init'.
#
# Commented settings below are the ones that act on the outside world at
# publish time. Everything else is safe to leave alone.

ai:
    api_key: ""
    api_version: ""
    audience: developers
    base_url: ""
    custom_prompts:
        changelog_system: ""
        changelog_user: ""
        marketing_system: ""
        marketing_user: ""
        release_notes_system: ""
        release_notes_user: ""
    enabled: false
    include_emoji: false
    max_tokens: 2048
    model: gpt-4
    provider: openai
    retry_attempts: 3
    temperature: 0.7
    timeout: 30s
    tone: professional
changelog:
    categories:
        build: Build System
        feat: Features
        fix: Bug Fixes
        perf: Performance Improvements
        refactor: Code Refactoring
        revert: Reverts
    exclude:
        - chore
        - ci
        - docs
        - style
        - test
    file: CHANGELOG.md
    format: keep-a-changelog
    group_by: type
    include_author: false
    include_commit_hash: true
    include_date: true
    issue_url: ""
    link_commits: false
    link_issues: false
    product_name: ""
    repository_url: https://github.com/relicta-tech/relicta
    template: ""
output:
    color: true
    format: text
    log_file: ""
    log_level: info
    plugin_audit_log: ""
    quiet: false
    verbose: false
# Plugins run at publish time. The github plugin creates a GitHub
# release; if your CI already publishes one on tag push, enabling both
# will publish twice.
plugins:
    - capabilities: null
      config:
        draft: false
      continue_on_error: false
      # Disabled deliberately. .github/workflows/release.yaml publishes the
      # GitHub release via GoReleaser, with Cosign signing, a Syft SBOM and
      # attestations, and only after its `governance` job approves. Enabling
      # this plugin would publish a second release for the same tag from
      # whichever machine ran `relicta publish` — unsigned, without
      # provenance, and bypassing the gate relicta exists to enforce.
      enabled: false
      hooks: []
      name: github
      path: ""
      timeout: 0s
versioning:
    build_metadata: ""
    bump_from: tag
    # Push the tag to the remote. THIS IS IRREVERSIBLE and, in any
    # repository whose release workflow triggers on tag push, it starts a
    # real public release. Leave false to tag locally and push yourself.
    git_push: false
    git_sign: false
    # Create a git tag for the release. Local only; see git_push below.
    git_tag: true
    prerelease_suffix: ""
    strategy: conventional
    tag_prefix: v
    version_file: ""
    version_files: []
workflow:
    allowed_branches:
        - main
    auto_commit_changelog: true
    changelog_commit_message: 'chore(release): update changelog for ${version}'
    dry_run_by_default: false
    post_release_hook: ""
    pre_release_hook: ""
    require_approval: true
    require_clean_working_tree: true
    require_up_to_date: false
