services:
  chronos:
    image: ghcr.io/klarlabs-studio/chronos:0.26.1
    ports:
      - "127.0.0.1:7778:7778"
    environment:
      CHRONOS_DB_DSN: sqlite:///tmp/chronos-demo.db
      CHRONOS_HTTP_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "/chronos", "health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
